name: Template Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Template tests and quality
    # Rendered projects use ci.yml; this job validates the unrendered source template.
    if: github.repository == 'amendez13/python-project-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run all template tests with coverage
        run: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=95
      - name: Run all quality hooks
        run: pre-commit run --all-files
